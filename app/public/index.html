<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />

    <!-- Force light rendering — the app is light-only.
         Overrides the phone's dark mode so colours never flip. -->
    <meta name="color-scheme" content="light" />
    <style>:root { color-scheme: light; }</style>

    <!-- Inter font — loaded before the app renders to avoid FOUT -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- PWA meta -->
    <meta name="theme-color" content="#1E7B4C" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="NavCamp" />
    <meta name="description" content="Campus navigation and transport for Veritas University Abuja." />

    <!-- Icons for home screen -->
    <link rel="apple-touch-icon" href="/navcamp-icon-192.png" />

    <title>NavCamp</title>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
