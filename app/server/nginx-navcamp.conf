server {
    listen 80;
    server_name api.oprides.site;

    # Let TierHive handle SSL — we just serve HTTP on port 80

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Pass Paystack signature header through unchanged
        proxy_set_header   x-paystack-signature $http_x_paystack_signature;

        # Timeouts
        proxy_connect_timeout  10s;
        proxy_send_timeout     30s;
        proxy_read_timeout     30s;

        # Body size — webhooks are small
        client_max_body_size   1m;
    }

    # Block access to hidden files
    location ~ /\. {
        deny all;
    }
}
