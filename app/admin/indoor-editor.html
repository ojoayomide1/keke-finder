<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NavCamp Admin — Indoor Editor</title>
  <link rel="stylesheet" href="css/admin.css" />
  <style>
    .building-tab { padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; font-size: 13px; font-weight: 600; color: var(--sub); }
    .building-tab.active { background: var(--green-dim); border-color: var(--green); color: var(--green); }
    .floor-tab { padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; font-size: 12px; font-weight: 600; color: var(--sub); }
    .floor-tab.active { background: var(--green-dim); border-color: var(--green); color: var(--green); }
    .room-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--bg); }
    .room-name { font-weight: 600; font-size: 13px; flex: 1; }
    .room-type { font-size: 11px; color: var(--sub); }
  </style>
</head>
<body>
<div class="main">
  <div class="page-header" style="display:flex;align-items:center;justify-content:space-between">
    <div>
      <h1 class="page-title">🏢 Indoor Editor</h1>
      <p class="page-sub">Manage indoor places stored in Firestore (synced to the app)</p>
    </div>
    <div style="display:flex;gap:10px">
      <button class="btn btn-ghost btn-sm" id="refresh-btn">↺ Refresh</button>
      <button class="btn btn-green" id="add-building-btn">+ Building</button>
    </div>
  </div>

  <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px" id="building-tabs"></div>

  <div id="editor-area">
    <div class="empty">Select or create a building to start editing.</div>
  </div>
</div>

<!-- Room modal -->
<div id="modal-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:200" onclick="closeRoomModal()"></div>
<div id="room-modal" style="display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;border-radius:16px;padding:28px;width:520px;max-width:96vw;max-height:90vh;overflow-y:auto;z-index:201">
  <h2 style="font-size:16px;font-weight:700;margin-bottom:16px" id="room-modal-title">Room</h2>
  <div style="display:flex;flex-direction:column;gap:12px" id="room-form"></div>
  <div style="display:flex;gap:10px;margin-top:18px;flex-wrap:wrap">
    <button class="btn btn-green" id="save-room-btn">Save</button>
    <button class="btn btn-red btn-sm" id="delete-room-btn" style="display:none">Delete room</button>
    <button class="btn btn-ghost btn-sm" onclick="closeRoomModal()">Cancel</button>
  </div>
</div>

<div id="toast"></div>

<script type="module">
  import { requireAdmin } from "./js/auth.js";
  import { renderNav, injectPageLoader } from "./js/nav.js";
  import { db }           from "./js/firebase.js";
  import {
    doc, getDoc, setDoc, serverTimestamp,
  } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

  const _loader = injectPageLoader();
  const _loader = injectPageLoader(); const admin = await requireAdmin();
  renderNav(admin.name); _loader.hide();
  _loader.hide();

  // ── Data lives in Firestore at indoorPlaces/main ──────────────────────
  // The local tools/indoor-editor reads/writes map-data/source/indoor_places.json
  // This admin panel reads/writes Firestore. To sync both directions:
  //   - Export from here → download JSON → replace map-data/source/indoor_places.json
  //   - Import: paste JSON into the import box below
  // Future: unify by having the local editor POST to this Firestore doc too.

  // indoorPlaces/main stores: { buildings: { ...same shape as indoor_places.json }, updatedAt, updatedBy }
  // The local editor (tools/indoor-editor/server.js) writes the same Firestore doc on every save.
  const DATA_REF = doc(db, "indoorPlaces", "main");
  let DATA = {};
  let activeBuildingId = null;
  let activeFloor      = null;
  let editingRoomId    = null;

  function showToast(msg, isErr) {
    const t = document.getElementById("toast");
    t.textContent = msg; t.className = isErr ? "error show" : "show";
    setTimeout(() => t.className = "", 3000);
  }

  async function loadData() {
    const snap = await getDoc(DATA_REF);
    if (snap.exists()) {
      const d = snap.data();
      // Support { buildings: {...} } shape (written by both editors)
      // and flat legacy shape just in case
      DATA = d.buildings ?? {};
    } else {
      DATA = {};
    }
    renderBuildingTabs();
  }

  async function saveData() {
    await setDoc(DATA_REF, {
      buildings:  DATA,
      updatedAt:  serverTimestamp(),
      updatedBy:  "admin-panel",
    });
  }

  // ── Building tabs ───────────────────────────────────────────────────────
  function renderBuildingTabs() {
    const container = document.getElementById("building-tabs");
    container.innerHTML = Object.entries(DATA).map(([id, b]) =>
      `<button class="building-tab${activeBuildingId===id?' active':''}" onclick="selectBuilding('${id}')">${b.name||id}</button>`
    ).join("") + `<button class="btn btn-ghost btn-sm" onclick="exportJson()">⬇ Export JSON</button>`;
    if (activeBuildingId) renderEditorArea();
    else document.getElementById("editor-area").innerHTML = '<div class="empty">Select or create a building to start editing.</div>';
  }

  window.selectBuilding = function(id) {
    activeBuildingId = id;
    activeFloor = DATA[id]?.floors?.[0]?.floor ?? 0;
    renderEditorArea();
    renderBuildingTabs();
  };

  // ── Editor area ─────────────────────────────────────────────────────────
  function renderEditorArea() {
    const b = DATA[activeBuildingId];
    if (!b) return;
    const floors = b.floors ?? [];
    const floorTabs = floors.map(f =>
      `<button class="floor-tab${f.floor===activeFloor?' active':''}" onclick="selectFloor(${f.floor})">${f.label||'Floor '+f.floor} (${(f.rooms||[]).length})</button>`
    ).join("") + `<button class="btn btn-ghost btn-sm" style="font-size:11px" onclick="addFloor()">+ Floor</button>`;

    const currentFloor = floors.find(f => f.floor === activeFloor);
    const rooms = currentFloor?.rooms ?? [];

    const roomRows = rooms.map(r => `
      <div class="room-row">
        <div style="flex:1">
          <div class="room-name">${r.name}</div>
          <div class="room-type">${r.room_type||''} ${r.occupant ? '· '+r.occupant : ''}</div>
        </div>
        <button class="btn btn-ghost btn-sm" onclick="openRoomModal('${r.id}')">Edit</button>
      </div>
    `).join("");

    document.getElementById("editor-area").innerHTML = `
      <div class="card">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
          <strong style="font-size:15px">${b.name}</strong>
          <button class="btn btn-red btn-sm" onclick="deleteBuilding('${activeBuildingId}')">Delete building</button>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px">${floorTabs}</div>
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
          <span style="font-size:13px;font-weight:700">Rooms on this floor</span>
          <button class="btn btn-green btn-sm" onclick="openRoomModal(null)">+ Add room</button>
        </div>
        <div id="room-list">${roomRows || '<div class="empty" style="padding:16px 0">No rooms on this floor.</div>'}</div>
      </div>
    `;
  }

  window.selectFloor = function(floor) { activeFloor = floor; renderEditorArea(); };

  // ── Add building ────────────────────────────────────────────────────────
  document.getElementById("add-building-btn").addEventListener("click", () => {
    const name = prompt("Building name:");
    if (!name) return;
    const id = "building_" + name.toLowerCase().replace(/\s+/g,"_").replace(/[^a-z0-9_]/g,"");
    if (DATA[id]) { showToast("Building ID already exists.", true); return; }
    DATA[id] = { name, floors: [{ floor: 0, label: "Ground Floor", rooms: [] }] };
    activeBuildingId = id;
    activeFloor = 0;
    saveData().then(() => { renderBuildingTabs(); showToast("Building created."); });
  });

  window.deleteBuilding = function(id) {
    if (!confirm(`Delete building "${DATA[id]?.name}"? This cannot be undone.`)) return;
    delete DATA[id];
    activeBuildingId = null;
    saveData().then(() => { renderBuildingTabs(); showToast("Building deleted."); });
  };

  window.addFloor = function() {
    const label = prompt("Floor label (e.g. First Floor):");
    if (!label) return;
    const num = (DATA[activeBuildingId].floors ?? []).length;
    DATA[activeBuildingId].floors.push({ floor: num, label, rooms: [] });
    activeFloor = num;
    saveData().then(() => { renderEditorArea(); showToast("Floor added."); });
  };

  // ── Room modal ──────────────────────────────────────────────────────────
  const ROOM_TYPES = ["office","lecture_hall","lab","restroom","store","common_room","clinic","chapel","cafeteria","other"];

  window.openRoomModal = function(roomId) {
    editingRoomId = roomId;
    const floor = DATA[activeBuildingId]?.floors?.find(f => f.floor === activeFloor);
    const room  = roomId ? floor?.rooms?.find(r => r.id === roomId) : null;

    document.getElementById("room-modal-title").textContent = room ? "Edit Room" : "New Room";
    document.getElementById("delete-room-btn").style.display = room ? "inline-flex" : "none";

    document.getElementById("room-form").innerHTML = `
      ${field("name",        "Room name",         room?.name        ?? "", "text")}
      ${selectField("room_type","Room type",       ROOM_TYPES, room?.room_type ?? "office")}
      ${field("occupant",    "Occupant name",      room?.occupant    ?? "", "text", "e.g. Dr. A. Musa")}
      ${field("title",       "Occupant title",     room?.title       ?? "", "text", "e.g. Dean, Faculty of Law")}
      ${field("department",  "Department",         room?.department  ?? "", "text")}
      ${field("course",      "Courses (CSV)",      room?.course      ?? "", "text", "e.g. LAW 101, LAW 201")}
      ${field("capacity",    "Capacity",           room?.capacity    ?? "", "number")}
      ${selectField("access","Access",             ["public","student","staff"], room?.access ?? "student")}
      ${selectField("status","Status",             ["open","closed","restricted"], room?.status ?? "open")}
      ${selectField("gender","Gender restriction", ["","male","female"], room?.gender ?? "")}
      ${field("tags",        "Tags / Keywords (CSV)", room?.tags     ?? "", "text", "e.g. dean,admin,dsa,bursary")}
      <div class="form-group" style="grid-column:1/-1">
        <label>Likely questions (one per line — helps NavBot find this place)</label>
        <textarea id="rf-questions" rows="3" placeholder="Where is debt recovery?\nHow do I pay school fees?\nWhere is the bursary?">${(room?.questions||[]).join("\n")}</textarea>
      </div>
      <div class="form-group" style="grid-column:1/-1">
        <label>Hint (shown in step 3 of directions)</label>
        <input type="text" id="rf-hint" value="${(room?.hint||"").replace(/"/g,'&quot;')}" placeholder="e.g. Third door on the left after the stairwell" />
      </div>
      <div class="form-group" style="grid-column:1/-1">
        <label>Custom Navigation Steps (one per line — leave empty for auto-generated)</label>
        <textarea id="rf-steps" rows="4" placeholder="Walk to the main gate&#10;Turn right past the chapel&#10;Room 204 is on your left">${(room?.steps||[]).join("\n")}</textarea>
      </div>
      ${field("entrance",    "Building entrance name (for outdoor routing)", room?.entrance ?? "", "text", "e.g. Faculty of Law main entrance")}
      ${field("floorPlan",   "Floor plan image URL (optional)",              room?.floorPlan ?? "", "text", "https://…")}
    `;

    document.getElementById("modal-overlay").style.display = "block";
    document.getElementById("room-modal").style.display    = "block";
  };

  function field(id, label, value, type="text", placeholder="") {
    return `<div class="form-group">
      <label>${label}</label>
      <input type="${type}" id="rf-${id}" value="${String(value).replace(/"/g,'&quot;')}" placeholder="${placeholder}" />
    </div>`;
  }
  function selectField(id, label, options, selected) {
    const opts = options.map(o => `<option value="${o}"${o===selected?' selected':''}>${o||'(none)'}</option>`).join("");
    return `<div class="form-group"><label>${label}</label><select id="rf-${id}">${opts}</select></div>`;
  }

  function val(id) { return document.getElementById("rf-"+id)?.value?.trim() ?? ""; }

  document.getElementById("save-room-btn").addEventListener("click", async () => {
    const name = val("name");
    if (!name) { showToast("Room name is required.", true); return; }

    const floor = DATA[activeBuildingId].floors.find(f => f.floor === activeFloor);
    if (!floor) { showToast("Floor not found.", true); return; }

    const id = editingRoomId ||
      "room_" + activeBuildingId + "_f" + activeFloor + "_" + name.toLowerCase().replace(/\s+/g,"_").replace(/[^a-z0-9_]/g,"") + "_" + Date.now();

    const room = {
      id, name,
      room_type:   val("room_type")   || null,
      occupant:    val("occupant")    || null,
      title:       val("title")       || null,
      department:  val("department")  || null,
      course:      val("course")      || null,
      capacity:    val("capacity") ? Number(val("capacity")) : null,
      access:      val("access")      || null,
      status:      val("status")      || "open",
      gender:      val("gender")      || null,
      tags:        val("tags")        || null,
      hint:        val("hint")        || null,
      steps:       document.getElementById("rf-steps")?.value.split("\n").map(s=>s.trim()).filter(Boolean) ?? [],
      questions:   document.getElementById("rf-questions")?.value.split("\n").map(s=>s.trim()).filter(Boolean) ?? [],
      entrance:    val("entrance")    || null,
      floorPlan:   val("floorPlan")   || null,
      description: val("hint")        || null, // keep description in sync with hint for legacy compat
      photo: null, notes: null, phone: null,
    };

    if (editingRoomId) {
      const idx = floor.rooms.findIndex(r => r.id === editingRoomId);
      if (idx >= 0) floor.rooms[idx] = room; else floor.rooms.push(room);
    } else {
      floor.rooms.push(room);
    }

    try {
      await saveData();
      closeRoomModal();
      renderEditorArea();
      showToast("Room saved.");
    } catch(e) { showToast("Failed: " + e.message, true); }
  });

  document.getElementById("delete-room-btn").addEventListener("click", async () => {
    if (!confirm("Delete this room?")) return;
    const floor = DATA[activeBuildingId].floors.find(f => f.floor === activeFloor);
    if (floor) floor.rooms = floor.rooms.filter(r => r.id !== editingRoomId);
    try {
      await saveData();
      closeRoomModal();
      renderEditorArea();
      showToast("Room deleted.");
    } catch(e) { showToast("Failed: " + e.message, true); }
  });

  window.closeRoomModal = function() {
    document.getElementById("modal-overlay").style.display = "none";
    document.getElementById("room-modal").style.display    = "none";
  };

  // ── Export JSON ─────────────────────────────────────────────────────────
  window.exportJson = function() {
    const blob = new Blob([JSON.stringify(DATA, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "indoor_places.json";
    a.click();
  };

  document.getElementById("refresh-btn").addEventListener("click", () => loadData().then(() => showToast("Refreshed.")));
  loadData();
</script>
</body>
</html>
