<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NavCamp Admin</title>
  <style>
    body { margin: 0; background: #F7F8FA; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: system-ui, sans-serif; }
    .loader { text-align: center; }
    .brand { font-size: 28px; font-weight: 800; margin-bottom: 16px; }
    .brand span { color: #1E7A46; }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #1E7A46; margin: 0 3px; animation: bounce 1.2s infinite; }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0%,80%,100% { transform: scale(0.6); opacity: 0.4; } 40% { transform: scale(1); opacity: 1; } }
  </style>
</head>
<body>
  <div class="loader">
    <div class="brand">Nav<span>Camp</span></div>
    <div><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
  </div>
  <script type="module">
    import { auth, db } from "./js/firebase.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

    onAuthStateChanged(auth, async (user) => {
      if (!user) { window.location.replace("login.html"); return; }
      const snap = await getDoc(doc(db, "users", user.uid)).catch(() => null);
      if (snap?.exists() && snap.data()?.isAdmin) {
        window.location.replace("dashboard.html");
      } else {
        window.location.replace("login.html?reason=unauthorized");
      }
    });
  </script>
</body>
</html>
